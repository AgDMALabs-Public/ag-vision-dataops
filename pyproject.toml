[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"


[project]
name = "ag-vision"
version = "1.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "boto3",
    "databricks>=0.2",
    "databricks-sdk>=0.57.0",
    "geopandas>=1.1.0",
    "google-cloud-storage>=3.1.1",
    "jsonschema>=4.25.1",
    "matplotlib>=3.10.3",
    "pandas>=2.0.0",
    "pandas-stubs==2.3.2.250926",
    "pytest>=8.4.2",
    "roboflow>=1.2.6",
    "setuptools>=80.9.0",
    "tiffile>=2018.10.18",
    "tqdm>=4.67.1",
    "open-aglabs @ git+https://github.com/AgDMALabs-Public/AgDMALabs-open.git",
    "numpy>=1.5.0",
    "torch==2.9.1", # Add this explicitly, limit spark errors
    "torchvision==0.24.1", # Pin this to match torch 2.5
    "huggingface-hub>=0.13.0",
    "python-dotenv>=0.9.9",
    "rasterio>=1.4.4",
    "typing_extensions>=4.10.0",
    "pydantic>=2.10.0",
    "supervision>=0.27.0",
    "mlflow>=2.10.0",
]


[tool.setuptools]
# This section tells setuptools what to do.
package-data = { "ag_vision" = ["model_weights/**/*"] }


[tool.setuptools.packages.find]
# Explicitly include only the 'ag_vision' package and its sub-packages.
# This will ignore the 'notebooks', 'pipelines', and other top-level folders.
include = ["ag_vision*"]
